kind = "mobile"
previewPath = "/stellify-mobile/"
title = "Stellify Mobile"
version = "1.0.0"
id = "artifacts/stellify-mobile"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/stellify-mobile/" ]
localPort = 25203

[services.development]
run = "pnpm --filter @workspace/stellify-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/stellify-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/stellify-mobile", "run", "serve" ]

[services.env]
PORT = "25203"
BASE_PATH = "/stellify-mobile/"
