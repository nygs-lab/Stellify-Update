openapi: 3.1.0
info:
  title: Api
  version: 0.1.0
  description: Stellify Church Management API
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
  - name: auth
  - name: members
  - name: profile
  - name: spiritual-habits
  - name: personal-habits
  - name: sharing-habits
  - name: church-hub
  - name: engagement
  - name: stellarboard
  - name: ministry
  - name: admin
  - name: groups
  - name: Storage
    description: Object storage upload and serving endpoints.

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  # ─── AUTH ────────────────────────────────────────────────────────────────────
  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Login with PCM/TCM ID and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResult"
        "401":
          description: Invalid credentials

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Logout
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "401":
          description: Not authenticated

  /auth/change-password:
    post:
      operationId: changePassword
      tags: [auth]
      summary: Change password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChangePasswordInput"
      responses:
        "204":
          description: Password changed

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Verify identity (churchId + email) and issue a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Identity verified, reset token issued
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PasswordResetTokenResponse"
        "400":
          description: Missing fields
        "404":
          description: No matching account

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Reset password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "204":
          description: Password reset
        "400":
          description: Invalid or expired token

  # ─── MEMBERS ─────────────────────────────────────────────────────────────────
  /members:
    get:
      operationId: listMembers
      tags: [members]
      summary: List all members
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [Active, Deactivated, Retired, Deleted]
        - name: accountType
          in: query
          schema:
            type: string
            enum: [PCM, TCM]
        - name: search
          in: query
          schema:
            type: string
      responses:
        "200":
          description: List of members
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Member"
    post:
      operationId: createMember
      tags: [members]
      summary: Create a new member (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}:
    get:
      operationId: getMember
      tags: [members]
      summary: Get a member by ID
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Member found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
        "404":
          description: Not found
    patch:
      operationId: updateMember
      tags: [members]
      summary: Update a member
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    delete:
      operationId: deleteMember
      tags: [members]
      summary: Delete a member (Admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /members/{id}/status:
    patch:
      operationId: updateMemberStatus
      tags: [members]
      summary: Update member account status
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MemberStatusUpdate"
      responses:
        "200":
          description: Status updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /members/{id}/stellar-status:
    patch:
      operationId: updateStellarStatus
      tags: [members]
      summary: Submit stellar status change request (creates approval awaiting Pastor)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StellarStatusUpdate"
      responses:
        "200":
          description: Approval request created; pendingStellarStatus set on member
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StellarStatusChangeResult"

  # ─── PROFILE (self) ───────────────────────────────────────────────────────────
  /profile:
    get:
      operationId: getProfile
      tags: [profile]
      summary: Get own profile
      responses:
        "200":
          description: Own profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"
    patch:
      operationId: updateProfile
      tags: [profile]
      summary: Update own profile (member-editable fields)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProfileUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Member"

  /profile/push-token:
    put:
      operationId: updatePushToken
      tags: [profile]
      summary: Register or update the Expo push token for the current member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PushTokenInput"
      responses:
        "204":
          description: Token saved
        "401":
          description: Not authenticated

  /profile/timezone:
    put:
      operationId: updateTimezone
      tags: [profile]
      summary: Store the member's IANA timezone (auto-detected by the client on login)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/TimezoneInput"
      responses:
        "204":
          description: Timezone saved
        "400":
          description: Invalid timezone value
        "401":
          description: Not authenticated

  # ─── DASHBOARD ────────────────────────────────────────────────────────────────
  /dashboard/summary:
    get:
      operationId: getDashboardSummary
      tags: [members]
      summary: Get personal dashboard summary including stellar status and countdown
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummary"

  /dashboard/notifications:
    get:
      operationId: getNotifications
      tags: [members]
      summary: Get incoming notifications for the current user
      responses:
        "200":
          description: Notifications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Notification"

  # ─── SPIRITUAL HABITS ─────────────────────────────────────────────────────────
  /habits/spiritual:
    get:
      operationId: getSpiritualHabits
      tags: [spiritual-habits]
      summary: Get spiritual habit cards for current week
      parameters:
        - name: weekStart
          in: query
          schema:
            type: string
      responses:
        "200":
          description: Spiritual habit data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpiritualHabitWeek"

  /habits/spiritual/log:
    post:
      operationId: logSpiritualHabit
      tags: [spiritual-habits]
      summary: Log a spiritual habit entry
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpiritualHabitLogInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpiritualHabitLog"

  /habits/spiritual/log/{id}:
    patch:
      operationId: updateSpiritualHabitLog
      tags: [spiritual-habits]
      summary: Update a spiritual habit log entry
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SpiritualHabitLogUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SpiritualHabitLog"

  /habits/spiritual/worship:
    post:
      operationId: logWorshipAttendance
      tags: [spiritual-habits]
      summary: Log weekly worship attendance (SHC004)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorshipAttendanceInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WorshipAttendanceLog"

  /habits/spiritual/huddle:
    post:
      operationId: logSharingHuddle
      tags: [spiritual-habits]
      summary: Log monthly sharing huddle attendance (SHC007)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharingHuddleInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingHuddleLog"

  /habits/spiritual/got:
    post:
      operationId: logGotHabit
      tags: [spiritual-habits]
      summary: Log GOT/Treasury submission (SHC003)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GotHabitInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/GotLog"

  /habits/spiritual/biblical:
    post:
      operationId: logBiblicalNotes
      tags: [spiritual-habits]
      summary: Log biblical notes completion (SHC005)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BiblicalNotesInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BiblicalNotesLog"

  /habits/spiritual/cg:
    post:
      operationId: logCgAttendance
      tags: [spiritual-habits]
      summary: Log CG attendance (SHC006)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CgAttendanceInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CgAttendanceLog"

  /habits/spiritual/unlock:
    post:
      operationId: unlockHabitWeek
      tags: [spiritual-habits]
      summary: Unlock a closed week for a member (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekUnlockInput"
      responses:
        "200":
          description: Week unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekUnlockResult"
        "403":
          description: Forbidden — Admin only

  /habits/unlock:
    post:
      operationId: unlockHabitWeekAlias
      tags: [spiritual-habits]
      summary: Unlock a closed week for a member — alias for /habits/spiritual/unlock (Admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WeekUnlockInput"
      responses:
        "200":
          description: Week unlocked
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WeekUnlockResult"
        "403":
          description: Forbidden — Admin only

  # ─── PERSONAL HABITS ──────────────────────────────────────────────────────────
  /habits/personal:
    get:
      operationId: getPersonalHabits
      tags: [personal-habits]
      summary: Get personal habit cards for current member
      responses:
        "200":
          description: Personal habits
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalHabit"
    post:
      operationId: addPersonalHabit
      tags: [personal-habits]
      summary: Add a personal habit card (within PHOW window)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalHabitInput"
      responses:
        "201":
          description: Added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalHabit"

  /habits/personal/week:
    get:
      operationId: getPersonalHabitsWeek
      tags: [personal-habits]
      summary: Get personal habit cards with full week log grid
      parameters:
        - name: weekStart
          in: query
          required: false
          schema:
            type: string
          description: ISO date of Sunday (defaults to current week)
      responses:
        "200":
          description: Personal habits with weekly logs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonalHabitWeek"

  /habits/personal/{id}:
    delete:
      operationId: removePersonalHabit
      tags: [personal-habits]
      summary: Remove a personal habit card (within PHOW window)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Removed

  /habits/personal/{id}/log:
    post:
      operationId: logPersonalHabit
      tags: [personal-habits]
      summary: Log personal habit progress
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonalHabitLogInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonalHabitLog"

  # ─── SHARING HABITS ───────────────────────────────────────────────────────────
  /habits/sharing:
    get:
      operationId: getSharingHabits
      tags: [sharing-habits]
      summary: Get sharing habit data for current member
      responses:
        "200":
          description: Sharing habit data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingHabit"

  /habits/sharing/preparation:
    post:
      operationId: logSharingPreparation
      tags: [sharing-habits]
      summary: Log sharing preparation (Level 1)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharingPreparationInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingPreparation"

  /habits/sharing/attempt:
    post:
      operationId: logSharingAttempt
      tags: [sharing-habits]
      summary: Log a sharing attempt (Level 2)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SharingAttemptInput"
      responses:
        "201":
          description: Logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SharingAttempt"

  /habits/sharing/bearing:
    post:
      operationId: logBearingResult
      tags: [sharing-habits]
      summary: Log a bearing result / conversion (Level 3)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BearingResultInput"
      responses:
        "201":
          description: Bearing logged
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BearingResult"

  # ─── CHURCH HUB ───────────────────────────────────────────────────────────────
  /church/sermons:
    get:
      operationId: listSermons
      tags: [church-hub]
      summary: List biblical message recordings
      responses:
        "200":
          description: Sermons
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Sermon"
    post:
      operationId: createSermon
      tags: [church-hub]
      summary: Create a sermon entry (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SermonInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sermon"

  /church/sermons/{id}:
    patch:
      operationId: updateSermon
      tags: [church-hub]
      summary: Update a sermon (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SermonUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Sermon"
    delete:
      operationId: deleteSermon
      tags: [church-hub]
      summary: Delete a sermon (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /church/events:
    get:
      operationId: listEvents
      tags: [church-hub]
      summary: List church events
      parameters:
        - name: upcoming
          in: query
          schema:
            type: boolean
      responses:
        "200":
          description: Events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ChurchEvent"
    post:
      operationId: createEvent
      tags: [church-hub]
      summary: Create a church event (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchEventInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchEvent"

  /church/events/{id}:
    patch:
      operationId: updateEvent
      tags: [church-hub]
      summary: Update an event (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChurchEventUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChurchEvent"
    delete:
      operationId: deleteEvent
      tags: [church-hub]
      summary: Delete an event (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  /church/guides:
    get:
      operationId: listGuides
      tags: [church-hub]
      summary: List church guides and feeds
      responses:
        "200":
          description: Guides
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Guide"
    post:
      operationId: createGuide
      tags: [church-hub]
      summary: Create a guide (Admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuideInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guide"

  /church/guides/{id}:
    patch:
      operationId: updateGuide
      tags: [church-hub]
      summary: Update a guide (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GuideUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Guide"
    delete:
      operationId: deleteGuide
      tags: [church-hub]
      summary: Delete a guide (Admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted

  # ─── ENGAGEMENT ───────────────────────────────────────────────────────────────
  /engagement/prayer-requests:
    get:
      operationId: listPrayerRequests
      tags: [engagement]
      summary: List prayer requests visible to current user
      responses:
        "200":
          description: Prayer requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PrayerRequest"
    post:
      operationId: createPrayerRequest
      tags: [engagement]
      summary: Submit a prayer request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerRequestInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerRequest"

  /engagement/prayer-requests/{id}/complete:
    patch:
      operationId: completePrayerRequest
      tags: [engagement]
      summary: Mark a prayer request as done
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Marked done
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerRequest"

  /engagement/prayer-requests/{id}:
    patch:
      operationId: updatePrayerRequest
      tags: [engagement]
      summary: Member edits own pending prayer request
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PrayerRequestUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PrayerRequest"

  /engagement/counseling:
    get:
      operationId: listCounselingRequests
      tags: [engagement]
      summary: List counseling requests
      responses:
        "200":
          description: Counseling requests
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CounselingRequest"
    post:
      operationId: createCounselingRequest
      tags: [engagement]
      summary: Submit a counseling request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CounselingRequestInput"
      responses:
        "201":
          description: Submitted
          content:
            application/json:
              schema:
